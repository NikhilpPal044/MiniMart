services:
  frontend:
    build:
      context: ./frontend
    container_name: minimart-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    container_name: minimart-backend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_HOST: host.docker.internal
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "nikhil@9953"
      DB_NAME: minimart
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: minimart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: nikhil@9953
      MYSQL_DATABASE: minimart
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
