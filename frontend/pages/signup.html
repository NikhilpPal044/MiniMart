<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMart - Sign Up</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>MiniMart</h1>
        <h2>Create Account</h2>

        <form id="signupForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

                <label for="email">Email</label> <input type="email" id="email" name="email" autocomplete="email" required>

               <label for="password">Password</label> <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>

              <button type="submit">Sign Up</button>
        </form>

        <p id="message" role="status"></p>

        <p>Already have an account?
            <a href="login.html">Login</a>
        </p>

        <a href="../index.html">Back to Home</a>
    </div>

    <script src="../js/app.js"></script>
   <script>
document.addEventListener("DOMContentLoaded", function () {
    const signupForm = document.getElementById("signupForm");
    const message = document.getElementById("message");

    if (!signupForm) {
        console.error("Signup form nahi mila. HTML mein id='signupForm' check karo.");
        return;
    }

    signupForm.addEventListener("submit", async function (event) {
        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        message.textContent = "Creating account...";

        try {
            const response = await fetch("http://localhost:8080/api/auth/signup", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                credentials: "include",
                body: JSON.stringify({
                    name: name,
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || data.error || "Signup failed");
            }

            message.textContent = "Signup successful! Ab login karo.";
            signupForm.reset();

        } catch (error) {
            message.textContent = "Signup error: " + error.message;
            console.error("Signup error:", error);
        }
    });
});
</script>
</body>
</html>
