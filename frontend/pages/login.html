<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMart - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="auth-container">
        <h1>MiniMart</h1>
        <h2>Login</h2>

        <form id="loginForm" autocomplete="on">
            <label for="email">Email</label> <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Password</label> <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit">Login</button>
        </form>

        <p id="message" role="status"></p>

        <p>Don't have an account?
            <a href="signup.html">Sign Up</a>
        </p>

        <a href="../index.html">Back to Home</a>
    </div>

    <script src="../js/app.js"></script>
   <script>
    const loginForm = document.getElementById("loginForm");
    const loginMessage = document.getElementById("message");

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        loginMessage.textContent = "Logging in...";

        try {
            const data = await apiRequest("/auth/login", {
                method: "POST",
                body: JSON.stringify({ email, password })
            });

            console.log("Login response:", data);

            const user = data.user || { email };
            localStorage.setItem("user", JSON.stringify(user));

            const token = data.token || data.access_token;

            if (token) {
                localStorage.setItem("token", token);
            }

            loginMessage.textContent = "Login successful!";

            setTimeout(() => {
                window.location.href = "../index.html";
            }, 700);

        } catch (error) {
            console.error("Login error:", error);
            loginMessage.textContent = error.message;
        }
    });
</script>

</body>
</html>
