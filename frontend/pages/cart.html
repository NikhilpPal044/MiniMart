<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniMart - Cart</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header>
        <h1>My Shopping Cart</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="orders.html">My Orders</a>
            <a href="profile.html">My Profile</a>
        </nav>
    </header>
    <main>
        <p id="message" role="status"></p>
        <div id="cartItems"></div>
        <h2 id="total">Total: ₹0</h2>
        <button id="checkoutBtn">Place Order</button>
    </main>

    <script src="../js/app.js"></script>

    <script>
        const cartItems = document.getElementById("cartItems");
        const totalElement = document.getElementById("total");
        const message = document.getElementById("message");
        const checkoutBtn = document.getElementById("checkoutBtn");

        let currentCart = [];

        async function loadCart() {
            cartItems.textContent = "Loading cart...";

            try {
                const data = await apiRequest("/cart");

                console.log("Cart API response:", data);

                currentCart = Array.isArray(data.items)
                    ? data.items
                    : Array.isArray(data.cart)
                        ? data.cart
                        : Array.isArray(data)
                            ? data
                            : [];

                console.log("Cart items:", currentCart);

                if (currentCart.length === 0) {
                    cartItems.textContent = "Your cart is empty.";
                    totalElement.textContent = "Total: ₹0";
                    return;
                }

                cartItems.innerHTML = "";
                let total = 0;

                currentCart.forEach(item => {
                    const row = document.createElement("div");
                    row.className = "cart-item";

                    const product = item.Product || item.product || {};
                    console.log("Cart product image data:", product);
                    const image = document.createElement("img");

                    if (product.name === "Wireless Mouse") {
                        image.src = "https://images.unsplash.com/photo-1527814050087-3793815479db?w=400";
                    } else if (product.name === "Mechanical Keyboard") {
                        image.src = "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=400";
                    } else if (product.name === "USB Headphones") {
                        image.src = "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400";
                    } else {
                        image.src = "https://placehold.co/300x200?text=Product";
                    }

                    image.alt = product.name || "Product image";
                    image.style.width = "150px";
                    image.style.height = "150px";
                    image.style.objectFit = "contain";

                    image.onerror = function () {
                        console.log("Image failed to load:", image.src);
                        image.alt = "Image unavailable";
                    };

                    const name = document.createElement("h3");
                    name.textContent =
                        product.name ||
                        item.product_name ||
                        item.name ||
                        "Product";


                    const price = Number(
                        product.price ??
                        item.product_price ??
                        item.price ??
                        0
                    );

                    const quantity = Number(item.quantity || 1);

                    const details = document.createElement("p");
                    details.textContent =
                        `Price: ₹${price} | Quantity: ${quantity}`;

                    const subtotal = price * quantity;
                    total += subtotal;

                    const minusButton = document.createElement("button");
                    minusButton.textContent = "-";
                    minusButton.onclick = () =>
                        updateQuantity(item, quantity - 1);

                    const plusButton = document.createElement("button");
                    plusButton.textContent = "+";
                    plusButton.onclick = () =>
                        updateQuantity(item, quantity + 1);

                    const removeButton = document.createElement("button");
                    removeButton.textContent = "Remove";
                    removeButton.onclick = () => removeItem(item);

                    row.append(
                        image,
                        name,
                        details,
                        minusButton,
                        plusButton,
                        removeButton
                    );

                    cartItems.appendChild(row);
                });

                totalElement.textContent = `Total: ₹${total}`;

            } catch (error) {
                console.error("Load cart error:", error);
                cartItems.textContent = error.message;
            }
        }

        async function updateQuantity(item, quantity) {
            if (quantity < 1) {
                await removeItem(item);
                return;
            }

            try {
                await apiRequest(`/cart/${item.id}`, {
                    method: "PATCH",
                    body: JSON.stringify({ quantity })
                });

                await loadCart();

            } catch (error) {
                message.textContent = error.message;
            }
        }

        async function removeItem(item) {
            try {
                await apiRequest(`/cart/${item.id}`, {
                    method: "DELETE"
                });

                message.textContent = "Product removed from cart.";
                await loadCart();

            } catch (error) {
                message.textContent = error.message;
            }
        }

        checkoutBtn.addEventListener("click", async function () {
            if (currentCart.length === 0) {
                message.textContent = "Your cart is empty.";
                return;
            }

            checkoutBtn.disabled = true;

            try {
                const data = await apiRequest("/orders", {
                    method: "POST",
                    body: JSON.stringify({})
                });

                message.textContent =
                    data.message || "Order placed successfully!";

                await loadCart();

            } catch (error) {
                message.textContent = error.message;
            } finally {
                checkoutBtn.disabled = false;
            }
        });

        console.log("MY CART PAGE JAVASCRIPT STARTED");
        loadCart();
    </script>

</body>

</html>
